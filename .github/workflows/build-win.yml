name: 构建 Windows 安装包

# 为什么要在 GitHub 的 Windows 机器上构建：
# 在 macOS 上交叉编译 Windows 包必须额外装 wine，Apple Silicon 上还有
# 默认产出 arm64、目录名长度敏感、无法签名三个坑。放到真实的 win32
# 环境里构建，这些问题全部消失，也不需要你自己准备一台 Windows 电脑。
#
# 免费额度：公开仓库的 Actions 完全免费、不计额度；私有仓库 Free 计划
# 每月 2000 分钟，Windows runner 按 2 倍计（约 1000 Windows 分钟/月）。
# 单次构建 3-8 分钟，怎么都够用。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  # 没发版需求时也能手动点一下按钮出包
  workflow_dispatch:

permissions:
  contents: read

# 连续推两次时取消前一次没跑完的构建，避免同一版本产出两份互相覆盖的包
concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    name: 构建 Windows x64 安装包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      # 守卫：主进程真正 require 的包必须留在 dependencies。
      # electron-vite 会按 dependencies 把它们「外置」（不打进 bundle），
      # 运行时从 node_modules 加载，而 electron-builder 只附带 dependencies 里的包。
      # 一旦误挪进 devDependencies，本地开发和测试全都正常，只有装到别人电脑上
      # 点到「导出 Excel」才会报模块找不到 —— 所以在这里卡死。
      - name: 校验主进程运行时依赖
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const need = ['exceljs', 'adm-zip'];
            const missing = need.filter((d) => !(pkg.dependencies && pkg.dependencies[d]));
            if (missing.length) {
              console.error('以下包必须留在 dependencies 里：' + missing.join(', '));
              process.exit(1);
            }
            console.log('主进程运行时依赖校验通过：' + need.join(', '));
          "

      # electron-vite 用 esbuild 转译，只剥类型、不做检查，所以 tsc 是唯一的
      # 类型关卡。本地已全绿，这里放行等于把类型错误直接带到安装包里。
      - name: 类型检查
        run: npm run typecheck

      # 在真实的 Windows 上跑数据层自检（当前 143 项）。
      # 这是整条流水线里最值的一步：项目用的是 Node 内置 node:sqlite，没有任何
      # 原生模块，而这恰恰意味着「本地跑得好好的」不能代表 Windows 上也对 ——
      # WAL 行为、文件锁、路径分隔符、排序规则、迁移事务都可能不同。
      # 这一步过了，「装到同事电脑上一导出就报错」这类只在 Windows 才炸的问题
      # 就能在出包前被拦住；不过就根本不出包。
      - name: 数据层自检（在 Windows 上验证 SQLite 与业务逻辑）
        run: npm run selftest

      # 一次产出两个文件：NSIS 安装包 + 免安装单文件版
      - name: 构建并打包
        run: npm run build:win:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
