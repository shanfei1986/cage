appId: com.lezu.fwjc
productName: 检测项目管理系统
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# 只把构建产物和 package.json 打进包里，源码不进。
# 注意：这里写的 patterns 只作用于应用目录，node_modules 里的**生产依赖**
# （即 package.json 的 dependencies）由 electron-builder 自动附带，不受这里影响。
# 所以 exceljs / adm-zip 能进包，而挪到 devDependencies 的前端库（antd、react、
# echarts…）不会进 —— 它们本来就由 Vite 打进界面 bundle，再进 asar 纯属浪费体积。
files:
  - out/**/*
  - package.json
  # 前端库带大量 .map（体积可观）且对运行毫无用处，排除掉
  - '!**/*.map'

asar: true

# 本项目没有任何原生模块（用的是 Node 内置 node:sqlite），
# 关掉 rebuild 能明显加快构建、也少一类失败原因
npmRebuild: false
nodeGypRebuild: false

# 只保留中英文资源，减小安装包体积
electronLanguages:
  - zh-CN
  - en-US

win:
  target:
    - target: nsis
      # 必须显式写 x64：在 Apple Silicon 上不写会默认产出 arm64 包
      arch:
        - x64
  icon: build/icon.ico
  artifactName: 检测项目管理系统-${version}-安装包.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 检测项目管理系统
  # 卸载绝不能删用户数据 —— 项目记录都在 %APPDATA% 里
  deleteAppDataOnUninstall: false
  language: '2052'
  installerLanguages:
    - zh_CN
  runAfterFinish: true

# 免安装单文件版（内部分发备用通道，用 npm run build:win:portable 触发）
portable:
  artifactName: 检测项目管理系统-${version}-免安装.${ext}
